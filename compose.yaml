services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0 
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    expose:
      - "8080"
    volumes:
      - ./infrastructure/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    networks:
      - frontend-net
      - backend-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - keycloak
    networks:
      - frontend-net
  backend:
    build:
      context: ./backend/
    expose:
      - "5000"
    develop:
      watch:
      - action: sync+restart
        path: ./backend
        target: /app/
        ignore:
            - .venv/
            - venv/
            - __pycache__/
            - "*.pyc"
      - action: rebuild
        path: ./backend/requirements.txt
    networks:
      - frontend-net
      - backend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
